<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maiuscula</title>
</head>
<body>
    <!-- Crie um input text em que, conforme o usuário digita, o conteúdo digitado é transformado em caixa alta -->

    <input onkeyup="this.value = this.value.toUpperCase()" type="text" placeholder="texto" id="texto">
</body>
</html>
